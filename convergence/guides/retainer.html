<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Retainer class guide for The Convergence Mod — all weapon and armor locations, starting stats, and strategy.">
    <title>Retainer — Convergence Mod Class Guide — Git Gudder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">

    <style>
        .class-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: stretch;
            margin-bottom: 36px;
        }
        @media (max-width: 700px) {
            .class-layout { grid-template-columns: 1fr; }
        }

        /* ── Hover flip card ── */
        .class-flip-wrap {
            display: flex;
            flex-direction: column;
        }
        .class-flip {
            position: relative;
            flex: 1;
            cursor: pointer;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .class-flip img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-lg);
            transition: opacity 0.35s ease;
        }
        .class-flip .stats-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
        }
        .class-flip:hover .portrait-img,
        .class-flip:focus .portrait-img { opacity: 0; }
        .class-flip:hover .stats-img,
        .class-flip:focus .stats-img { opacity: 1; }
        .flip-hint {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 6px;
            flex-shrink: 0;
        }

        /* ── Video panel ── */
        .class-video-wrap {
            display: flex;
            flex-direction: column;
        }
        .class-video-wrap .video-wrapper {
            flex: 1;
            margin: 0;
            padding-bottom: 0;
            position: relative;
            height: 0;
            padding-top: 56.25%;
        }
        .class-video-wrap .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
        }

        .class-label {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 6px;
        }
        .class-title {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header class="site-header" id="global-header"></header>

    <main class="content-section">
        <nav class="subpage-nav-container" data-conv-nav="classes"></nav>

        <div class="guide-body">

            <div class="class-label">Convergence Mod · Starting Class</div>
            <h1 class="class-title">Retainer</h1>

            <div class="class-layout">

                <div class="class-flip-wrap">
                    <div class="class-flip" tabindex="0" aria-label="Hover to see Retainer starting stats">
                        <img class="portrait-img" src="/convergence/images/retainer-portrait.png" alt="Retainer class portrait">
                        <img class="stats-img" src="/convergence/images/retainer-stats.png" alt="Retainer starting stats">
                    </div>
                    <p class="flip-hint">Hover to see starting stats</p>
                </div>

                <div class="class-video-wrap">
                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/tYhtv8FEQ9s"
                            title="Path of the Retainer in Elden Ring Convergence — Git Gudder"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <footer role="contentinfo" id="global-footer"></footer>
    <script src="/site.js"></script>
</body>
</html>
